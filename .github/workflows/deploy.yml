name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so posts with a future pubDatetime go live on schedule.
  # A static site does not republish itself; something has to trigger a build.
  #
  # 13:13 UTC is 09:13 America/New_York under EDT, and 08:13 under EST, so this
  # drifts an hour earlier after the November changeover. Bump to "13 14 * * *"
  # then if the morning slot matters.
  #
  # The odd minute is deliberate. GitHub queues scheduled workflows and the top
  # of the hour is the most congested slot; "0 14 * * *" was consistently
  # landing four hours late. There is still no timing guarantee, so give posts
  # a pubDatetime at or before this time rather than exactly on it, and use the
  # workflow_dispatch trigger below to publish something immediately.
  schedule:
    - cron: "13 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before starting the next; don't cancel a run in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
